<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Pusat Administrasi Guru</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">G</div><div><b>Admin Guru</b><small>Pusat Administrasi</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">⌂ <span>Beranda</span></button>
      <div class="nav-group">REFERENSI KURIKULUM</div>
      <button class="nav-item" data-page="curriculum">▣ <span>CP / TP / ATP</span></button>
      <button class="nav-item" data-page="materials">◈ <span>Bab & Materi</span></button>
      <button class="nav-item" data-page="learning">✦ <span>Pembelajaran</span></button>
      <div class="nav-group">PERANGKAT AJAR</div>
      <button class="nav-item" data-page="documents">▤ <span>Dokumen Ajar</span></button>
      <button class="nav-item" data-page="editor">✎ <span>Editor</span></button>
      <div class="nav-group">ADMINISTRASI KELAS</div>
      <button class="nav-item" data-page="students">♙ <span>Data Siswa</span></button>
      <button class="nav-item" data-page="attendance">✓ <span>Absensi</span></button>
      <button class="nav-item" data-page="journal">▤ <span>Jurnal Kelas</span></button>
      <button class="nav-item" data-page="schedule">◷ <span>Jadwal</span></button>
      <div class="nav-group">PENILAIAN</div>
      <button class="nav-item" data-page="assessment">▥ <span>Penilaian</span></button>
      <button class="nav-item" data-page="reports">▧ <span>Laporan</span></button>
    </nav>
    <div class="sidebar-bottom"><button class="nav-item" data-page="settings">⚙ <span>Pengaturan</span></button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="crumb" id="crumb">Beranda</div>
      <div class="top-actions">
        <span class="offline" id="syncState">● Tersimpan lokal</span>
        <button class="icon-btn" title="Notifikasi">♢</button>
        <div class="avatar">GF</div>
      </div>
    </header>

    <section id="app" class="content"></section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>

<div id="exportActions" class="export-actions">
  <label class="print-paper-label no-print" style="display:inline-flex;align-items:center;gap:6px;">
  Ukuran Kertas
  <select id="paperSize" class="no-print" title="Ukuran kertas untuk cetak/PDF/Word">
    <option value="A4">A4 (210 × 297 mm)</option>
    <option value="F4">F4/Folio (215.9 × 330.2 mm)</option>
  </select>
</label>
<button type="button" class="btn btn-secondary" onclick="printDocument()">🖨️ Print</button>
  <button type="button" class="btn btn-secondary" onclick="exportDocumentPDF()">📄 PDF</button>
  <button type="button" class="btn btn-secondary" onclick="exportDocumentWord()">📝 Word</button>
</div>
</body>
</html>
